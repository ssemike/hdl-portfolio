name: HDL Lint and Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Verilator and Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y verilator iverilog make

      - name: Lint (Verilator)
        run: make lint

      - name: Simulation tests (Icarus Verilog)
        run: make test